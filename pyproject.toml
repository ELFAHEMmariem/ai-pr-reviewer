[project]
name = "ai-pr-reviewer"
version = "0.1.0"
description = "AI Pull Request Reviewer with a Team Playbook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq",
    "httpx",
    "pydantic",
    "python-dotenv",
    "unidiff",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewer"]